<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>모바일 청첩장</title>
<!-- SNS/카톡 공유 OG 태그 -->
<!-- 기본값은 og-default.jpg, 카드 로드 후 대표사진(main_photo_url)이 있으면 JS로 갱신 -->
<meta property="og:type" content="website"/>
<meta property="og:title" id="og-title" content="모바일 청첩장"/>
<meta property="og:description" id="og-desc" content="저희 결혼식에 초대합니다"/>
<meta property="og:image" id="og-image" content="https://kkacmn-cpu.github.io/wedding/og-default.jpg"/>
<meta property="og:image:secure_url" id="og-image-secure" content="https://kkacmn-cpu.github.io/wedding/og-default.jpg"/>
<meta property="og:image:width" content="800"/>
<meta property="og:image:height" content="800"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" id="tw-title" content="모바일 청첩장"/>
<meta name="twitter:image" id="tw-image" content="https://kkacmn-cpu.github.io/wedding/og-default.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Sans+JP:wght@300;400&family=Noto+Sans+Thai:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Gowun+Batang&family=Nanum+Myeongjo&family=Song+Myung&family=Gowun+Dodum&family=Gaegu&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ivory:#fcf9f4;--ivory-2:#f7f1e8;--brown:#3a2f26;--brown-soft:#5c4e42;
  --brown-mute:#8a7a6a;--gold:#b8945f;--gold-deep:#9a7740;--gold-pale:#e9dcc4;
  --gold-wash:#f5eedf;--line:#e8ddcc;--white:#ffffff;--ok:#6f8f6a;--sand:#d9c8af;
  --sh-sm:0 4px 18px -8px rgba(58,47,38,.18);
  --serif:'Noto Serif KR',serif;--sans:'Noto Sans KR',sans-serif;
}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--ivory);color:var(--brown);min-height:100vh;font-weight:300;-webkit-font-smoothing:antialiased;}

/* 로딩 */
#loading{position:fixed;inset:0;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s;}
#loading.hide{opacity:0;pointer-events:none;}
.loading-logo{font-family:var(--serif);font-size:22px;color:var(--gold-deep);margin-bottom:20px;letter-spacing:2px;}
.loading-dots{display:flex;gap:8px;}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dot .9s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,100%{opacity:.2;transform:scale(.8);}50%{opacity:1;transform:scale(1.2);}}

/* 청첩장 전체 */
#card{max-width:480px;margin:0 auto;background:var(--white);min-height:100vh;position:relative;overflow:hidden;}

/* 오프닝 */
.op-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
.op-overlay.done{display:none;}
.op-names{font-family:var(--serif);font-size:28px;letter-spacing:3px;color:inherit;margin-bottom:12px;}
.op-sub{font-size:13px;letter-spacing:2px;opacity:.7;}
.op-tap{font-size:12px;letter-spacing:1px;opacity:.5;margin-top:28px;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.3;}50%{opacity:.7;}}
/* 오프닝 테마별 */
.op-fade{background:var(--ivory);color:var(--brown);animation:opFade 2.8s ease forwards;}
.op-zoom{background:var(--ivory);color:var(--brown);animation:opFade 2.8s ease forwards;}
.op-zoom .op-names{animation:opZoomIn 2.2s cubic-bezier(.2,.7,.2,1) forwards;opacity:0;}
.op-letter{background:var(--ivory);color:var(--brown);animation:opFade 2.9s ease forwards;}
.op-letter .op-names{animation:opLetter 1.8s .2s cubic-bezier(.2,.7,.2,1) forwards;opacity:0;letter-spacing:14px;}
.op-glow{background:var(--ivory);color:var(--brown);animation:opFade 2.8s ease forwards;overflow:hidden;}
.op-shimmer{background:var(--ivory);color:var(--brown);animation:opFade 2.9s ease forwards;overflow:hidden;}
.op-shimmer::before{content:'';position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(105deg,transparent,rgba(255,245,220,.55),transparent);animation:opShimmer 1.8s .5s ease forwards;}
.op-petal{background:var(--ivory);color:var(--brown);animation:opFade 2.8s ease forwards;}
.op-curtain{background:var(--ivory);color:var(--brown);animation:opHideLate 2.6s forwards;}
.op-curtain::before,.op-curtain::after{content:'';position:absolute;left:0;right:0;height:50%;background:var(--ivory-2);}
.op-curtain::before{top:0;animation:splitT 1.8s .7s cubic-bezier(.7,0,.3,1) forwards;}
.op-curtain::after{bottom:0;animation:splitB 1.8s .7s cubic-bezier(.7,0,.3,1) forwards;}
.op-split{background:#2a231d;color:var(--gold-pale);animation:opHideLate 2.6s forwards;}
.op-split::before,.op-split::after{content:'';position:absolute;left:0;right:0;height:50%;background:#2a231d;}
.op-split::before{top:0;animation:splitT 1.8s .7s cubic-bezier(.7,0,.3,1) forwards;}
.op-split::after{bottom:0;animation:splitB 1.8s .7s cubic-bezier(.7,0,.3,1) forwards;}
.op-circle{background:var(--ivory);color:var(--brown);clip-path:circle(0% at 50% 50%);animation:opCircle 2.6s ease forwards;}
.op-petal-fall{position:absolute;font-size:16px;opacity:0;animation:fall linear infinite;pointer-events:none;}
@keyframes fall{0%{opacity:0;transform:translateY(-30px) rotate(0);}12%{opacity:.5;}88%{opacity:.5;}100%{opacity:0;transform:translateY(110vh) rotate(360deg);}}
@keyframes opFade{0%,70%{opacity:1;}100%{opacity:0;visibility:hidden;}}
@keyframes opHideLate{0%,75%{opacity:1;}100%{opacity:0;visibility:hidden;}}
@keyframes opZoomIn{0%{opacity:0;transform:scale(1.3);}30%{opacity:1;}100%{opacity:1;transform:scale(1);}}
@keyframes opLetter{0%{opacity:0;letter-spacing:14px;}100%{opacity:1;letter-spacing:3px;}}
@keyframes opShimmer{to{left:120%;}}
@keyframes splitT{to{transform:translateY(-100%);}}
@keyframes splitB{to{transform:translateY(100%);}}
@keyframes opCircle{0%{clip-path:circle(0% at 50% 50%);opacity:1;}50%{clip-path:circle(75% at 50% 50%);opacity:1;}80%{opacity:1;}100%{clip-path:circle(75% at 50% 50%);opacity:0;visibility:hidden;}}

/* 커버 */
.iv-cover{padding:64px 30px 48px;text-align:center;position:relative;}
.iv-eyebrow{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:5px;text-transform:uppercase;opacity:.55;margin-bottom:18px;font-weight:400;}
.iv-names{font-size:27px;letter-spacing:3px;font-weight:400;line-height:1.55;margin-bottom:6px;}
.iv-amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;margin:0 8px;}
.iv-photo{width:182px;height:226px;margin:26px auto 0;border-radius:120px 120px 10px 10px;background:var(--gold-wash);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 36px -18px rgba(58,47,38,.4);}
.iv-photo img{width:100%;height:100%;object-fit:cover;}
.iv-div{width:36px;height:1px;margin:24px auto;background:var(--gold);opacity:.4;}
.iv-date{font-size:14px;letter-spacing:1.5px;line-height:1.7;}
.sub-lang{display:block;font-size:.82em;font-weight:300;opacity:.55;margin-top:4px;font-family:'Noto Sans KR','Noto Sans JP','Noto Sans Thai',sans-serif;letter-spacing:.5px;}

/* 섹션 */
.iv-sec{padding:46px 30px;text-align:center;border-top:1px solid rgba(0,0,0,.05);}
.iv-sec-t{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;opacity:.55;margin-bottom:18px;font-weight:400;}
.iv-msg{font-size:14.5px;line-height:2.15;font-weight:300;white-space:pre-line;margin-top:4px;letter-spacing:.2px;}
.iv-info{font-size:14px;line-height:1.95;margin-top:4px;}
.iv-info b{font-weight:500;}
.iv-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.iv-chip{font-size:12px;padding:10px 18px;border-radius:999px;border:1px solid currentColor;opacity:.6;cursor:pointer;transition:all .25s;text-decoration:none;color:inherit;display:inline-block;letter-spacing:.5px;}
.iv-chip:hover{opacity:1;transform:translateY(-1px);}
.iv-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.iv-gal .g{aspect-ratio:1;border-radius:8px;background:var(--ivory-2);overflow:hidden;cursor:pointer;}
.iv-gal .g img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease;}
.iv-gal .g:hover img{transform:scale(1.06);}
.dday-box{display:flex;justify-content:center;gap:20px;margin-top:6px;}
.dday-unit{text-align:center;}
.dday-num{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:400;line-height:1;letter-spacing:1px;}
.dday-lbl{font-size:11px;letter-spacing:1.5px;opacity:.55;margin-top:8px;}
.iv-foot{padding:42px 30px;text-align:center;font-size:11px;opacity:.45;letter-spacing:1.5px;line-height:1.9;}

/* 계좌 */
.acc-box{margin-top:6px;text-align:left;}
.acc-toggle{cursor:pointer;list-style:none;text-align:center;font-size:12px;letter-spacing:1px;padding:13px 0;border:1px solid currentColor;border-radius:999px;opacity:.45;transition:opacity .25s;width:100%;}
.acc-toggle:hover{opacity:.7;}
.acc-toggle::-webkit-details-marker{display:none;}
.acc-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.acc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 16px;border-radius:12px;background:rgba(0,0,0,.025);border:1px solid rgba(0,0,0,.04);}
.acc-info{display:flex;flex-direction:column;gap:3px;}
.acc-side{font-size:10px;letter-spacing:1px;opacity:.5;text-transform:uppercase;}
.acc-bank{font-size:13px;font-weight:500;}
.acc-num{font-size:13px;opacity:.8;letter-spacing:.3px;}
.acc-copy{flex-shrink:0;font-size:11px;padding:9px 15px;border-radius:999px;background:rgba(0,0,0,.06);color:inherit;cursor:pointer;border:none;transition:all .25s;opacity:.7;}
.acc-copy:hover{opacity:1;background:rgba(0,0,0,.1);}
.acc-copy.done{background:var(--ok);color:#fff;opacity:1;}

/* 방명록 */
.guest-form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.guest-form input,.guest-form textarea{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ivory);font-size:13.5px;font-family:inherit;color:var(--brown);outline:none;resize:none;transition:border-color .25s;}
.guest-form input:focus,.guest-form textarea:focus{border-color:var(--gold);background:#fff;}
.guest-submit{background:var(--gold);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;cursor:pointer;width:100%;transition:background .25s;letter-spacing:.5px;}
.guest-submit:hover{background:var(--gold-deep);}
.guest-list{margin-top:20px;display:flex;flex-direction:column;gap:10px;}
.guest-item{background:var(--ivory-2);border-radius:12px;padding:16px 18px;text-align:left;}
.guest-item .gi-name{font-size:13px;font-weight:500;color:var(--brown);margin-bottom:5px;}
.guest-item .gi-msg{font-size:13.5px;color:var(--brown-soft);line-height:1.8;}
.guest-item .gi-date{font-size:11px;color:var(--brown-mute);margin-top:8px;letter-spacing:.5px;}

/* RSVP */
.rsvp-form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.rsvp-opts{display:flex;gap:10px;}
.rsvp-opt{flex:1;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;text-align:center;cursor:pointer;transition:all .25s;background:var(--white);letter-spacing:.5px;}
.rsvp-opt.on{background:var(--gold);color:#fff;border-color:var(--gold);}
.rsvp-form input,.rsvp-form select,.rsvp-form textarea{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--ivory);font-size:13.5px;font-family:inherit;color:var(--brown);outline:none;transition:border-color .25s;}
.rsvp-form input:focus,.rsvp-form select:focus{border-color:var(--gold);background:#fff;}
.rsvp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rsvp-submit{background:var(--brown);color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;cursor:pointer;width:100%;transition:background .25s;letter-spacing:.5px;}
.rsvp-submit:hover{background:var(--gold-deep);}
.privacy{font-size:11px;color:var(--brown-mute);line-height:1.7;margin-top:10px;text-align:center;opacity:.8;}

/* 갤러리 라이트박스 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:800;display:none;align-items:center;justify-content:center;}
.lightbox.show{display:flex;}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px;object-fit:contain;}
.lb-close{position:absolute;top:20px;right:24px;color:#fff;font-size:28px;cursor:pointer;}

/* ================================================================
   12종 템플릿 CSS
   각 템플릿은 색감 + 폰트 느낌 + 커버 레이아웃이 모두 다릅니다
   ================================================================ */

/* ============================================================
   1. SIGNATURE PHOTO — 거의 풀스크린 사진 (웨딩 매거진 첫 장)
   ============================================================ */
.t-signature{background:#0c0a08;color:#3a2f26;}
.t-signature .iv-cover{padding:0;}
/* 풀스크린 포토형 — 사진이 주인공, 텍스트 최소 */
.sig-hero{position:relative;width:100%;height:100vh;min-height:600px;max-height:1000px;overflow:hidden;background:#0c0a08;}
.sig-photo{position:absolute;inset:0;width:100%;height:100%;}
.sig-photo img{width:100%;height:100%;object-fit:cover;object-position:center 34%;display:block;animation:sigKenburns 20s ease-out forwards;}
@keyframes sigKenburns{from{transform:scale(1.06);}to{transform:scale(1);}}
/* 하단 안전영역만 살짝 어둡게 — 사진 대부분은 그대로 */
.sig-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,6,4,.26) 0%,transparent 14%,transparent 70%,rgba(8,6,4,.42) 90%,rgba(8,6,4,.7) 100%);}
.sig-top{position:absolute;top:40px;left:0;right:0;text-align:center;z-index:2;}
.sig-label{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:7px;color:rgba(255,255,255,.7);text-shadow:0 1px 12px rgba(0,0,0,.5);}
/* 텍스트는 하단 안전영역에 작고 얇게 */
.sig-overlay{position:absolute;left:0;right:0;bottom:0;padding:0 30px 42px;text-align:center;z-index:2;}
.sig-names{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;letter-spacing:6px;color:#fff;line-height:1;white-space:nowrap;text-shadow:0 2px 22px rgba(0,0,0,.45);}
.sig-names .sig-dot{display:inline-block;margin:0 13px;font-size:17px;vertical-align:middle;opacity:.65;}
.sig-date{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:5px;color:rgba(255,255,255,.76);margin-top:14px;white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.45);}
@media (max-width:380px){
  .sig-names{font-size:23px;letter-spacing:4px;}
  .sig-names .sig-dot{margin:0 10px;font-size:15px;}
  .sig-date{font-size:9px;letter-spacing:4px;}
}
@keyframes sigScroll{0%{transform:translateY(-12px);opacity:0;}40%{opacity:1;}100%{transform:translateY(34px);opacity:0;}}
.t-signature .iv-sec{border-top:1px solid rgba(184,148,95,.14);}
.t-signature .iv-sec-t{color:#9a7740;}
.t-signature .iv-names{font-family:'Cormorant Garamond',serif;}

/* ============================================================
   2. CLASSIC IVORY — 고급 종이청첩장 첫 장 (골드 더블라인 + 명조)
   ============================================================ */
.t-classic-ivory{background:#f6efe0;color:#3a2f26;}
.t-classic-ivory .iv-cover{padding:0;}
/* B안 안전형: 사진(72%) + 아이보리 정보 패널(28%) */
.civ-stage{position:relative;width:100%;height:100vh;min-height:600px;max-height:1000px;display:flex;flex-direction:column;background:#f6efe0;overflow:hidden;}
.civ-photo-area{position:relative;flex:0 0 72%;overflow:hidden;background:#e8dcc6;}
.civ-photo{position:absolute;inset:0;width:100%;height:100%;}
.civ-photo img{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block;}
.civ-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:linear-gradient(170deg,#fdfcf8,#f3ead8);padding:0 28px;}
.civ-label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:8px;color:#b6995f;text-transform:uppercase;}
.civ-names{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:500;letter-spacing:5px;color:#2a2018;line-height:1;white-space:nowrap;}
.civ-names .civ-dot{font-family:'Cormorant Garamond',serif;font-style:italic;color:#b08c4b;font-weight:400;font-size:23px;margin:0 11px;}
.civ-divider{display:flex;align-items:center;justify-content:center;gap:11px;}
.civ-dash{width:38px;height:1px;background:linear-gradient(to right,transparent,#c9b27a);}
.civ-divider .civ-dash:last-child{background:linear-gradient(to left,transparent,#c9b27a);}
.civ-diamond{font-size:8px;color:#b08c4b;}
.civ-date{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:6px;color:#6a5a48;white-space:nowrap;}
.civ-time{font-family:'Noto Serif KR',serif;font-size:11px;letter-spacing:2px;color:#9a8a76;white-space:nowrap;}
@media (max-width:380px){
  .civ-names{font-size:25px;letter-spacing:3px;}
  .civ-names .civ-dot{margin:0 8px;font-size:19px;}
  .civ-date{font-size:13px;letter-spacing:4px;}
}
@media (max-width:380px){
  .civ-names{font-size:23px;letter-spacing:2px;}
  .civ-names .civ-dot{margin:0 7px;font-size:18px;}
}
.t-classic-ivory .cls-paper{position:relative;text-align:center;}
.cls-topline,.cls-botline{width:1px;height:54px;margin:0 auto;background:linear-gradient(to bottom,transparent,#bfa063);}
.cls-botline{background:linear-gradient(to top,transparent,#bfa063);margin-top:8px;}
.cls-invite{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:9px;color:#9a7740;margin-top:30px;}
.cls-sub{font-family:'Noto Serif KR',serif;font-size:12px;letter-spacing:4px;color:#a89576;margin-top:12px;}
.cls-sym{font-size:15px;color:#c8a878;margin:26px 0 4px;opacity:.7;}
.cls-names{font-family:'Noto Serif KR',serif;font-size:30px;font-weight:400;letter-spacing:6px;line-height:1.75;color:#2c2218;margin-top:18px;}
.cls-names .iv-amp{font-family:'Cormorant Garamond',serif;font-style:italic;color:#bfa063;font-weight:400;font-size:24px;margin:0 6px;}
.cls-photo{width:158px;height:200px;margin:34px auto 30px;overflow:hidden;border:1px solid rgba(191,160,99,.4);padding:6px;background:#fff;}
.cls-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.cls-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin:34px auto 0;}
.cls-dash{width:46px;height:1px;background:#cbb277;}
.cls-diamond{font-size:9px;color:#bfa063;}
.cls-date{font-family:'Cormorant Garamond',serif;font-size:21px;letter-spacing:4px;color:#4a3f33;margin-top:24px;}
.cls-time{font-family:'Noto Serif KR',serif;font-size:12px;letter-spacing:3px;color:#8a7a6a;margin-top:10px;}
.t-classic-ivory .iv-sec{border-top:1px solid rgba(168,138,88,.16);}
.t-classic-ivory .iv-sec::before{content:'\2766';display:block;text-align:center;font-size:13px;color:#c8a878;margin-bottom:16px;opacity:.5;}
.t-classic-ivory .iv-sec-t{color:#9a7740;}
.t-classic-ivory .iv-names{font-family:'Noto Serif KR',serif;}

/* ============================================================
   3. MAGAZINE COVER — 진짜 웨딩 매거진 표지 (초대형 타이틀 + 사이드 라벨)
   ============================================================ */
.t-magazine{background:#15110d;color:#f4f1ea;}
.t-magazine .iv-cover{padding:0;}
.mag-hero{position:relative;width:100%;height:96vh;min-height:600px;max-height:940px;overflow:hidden;background:#1c1814;}
.mag-photo{position:absolute;inset:0;width:100%;height:100%;}
.mag-photo img{width:100%;height:100%;object-fit:cover;display:block;}

.qr-dl{background:var(--gold);color:#fff;border:none;}

.qr-close-btn{background:transparent;border:1px solid var(--sand);color:var(--brown-soft);}

/* 달력 추가 토스트 */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--brown);color:var(--ivory);padding:12px 24px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:all .3s;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

/* ===== XSS 방어 유틸 ===== */
function esc(str){
  if(str==null)return'';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#x27;');
}
function safeUrl(url){
  if(!url)return'';
  try{const u=new URL(url);if(['http:','https:'].includes(u.protocol))return url;}catch{}
  return'';
}

/* 날짜 포맷 */
function fmtDate(d){
  if(!d)return null;
  const dt=new Date(d),dy=['일','월','화','수','목','금','토'];
  return`${dt.getFullYear()}. ${dt.getMonth()+1}. ${dt.getDate()} ${dy[dt.getDay()]}요일`;
}
function fmtTime(t){
  if(!t)return'';
  let[h,m]=t.split(':').map(Number);
  return`${h<12?'오전':'오후'} ${h%12||12}시${m?' '+m+'분':''}`;
}
function fmtDateLang(d,t,lang){
  if(!d||!lang)return'';
  const dt=new Date(d);
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DEN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  if(lang==='en')return`${DEN[dt.getDay()]}, ${M[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}${t?' · '+t:''}`;
  if(lang==='vi')return`${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`;
  if(lang==='th')return`${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()+543}`;
  if(lang==='ja')return`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
  return'';
}
function dday(d){if(!d)return null;const a=new Date();a.setHours(0,0,0,0);const b=new Date(d);b.setHours(0,0,0,0);return Math.round((b-a)/864e5);}

/* 계좌 복사 */
function copyAcc(btn){
  /* 계좌번호는 onclick 인라인이 아닌 data-acc 속성에서 읽어 보안 개선 */
  const txt=btn.dataset.acc||'';
  if(!txt)return;
  navigator.clipboard.writeText(txt).then(()=>{
    const orig=btn.textContent;
    btn.textContent='복사됨 ✓';btn.classList.add('done');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('done');},1400);
  }).catch(()=>{
    /* clipboard API 실패 시 fallback */
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');btn.textContent='복사됨 ✓';btn.classList.add('done');
      setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done');},1400);}catch(e){}
    document.body.removeChild(ta);
  });
}

/* 공유용 URL: VPS SSR 주소 (카카오/SNS가 OG 태그를 읽도록)
   사람이 열면 VPS가 실제 카드로 자동 리다이렉트 */
function getShareUrl(){
  const VPS_BASE='https://weddingapi.duckdns.org';
  if(slug)return `${VPS_BASE}/card/${encodeURIComponent(slug)}`;
  return location.href;
}

function copyCardLink(){
  const shareUrl=getShareUrl();
  navigator.clipboard.writeText(shareUrl)
    .then(()=>showToast('링크가 복사됐어요 ✓'))
    .catch(()=>{
      /* clipboard API 실패 시 fallback */
      const ta=document.createElement('textarea');
      ta.value=shareUrl;document.body.appendChild(ta);ta.select();
      document.execCommand('copy');document.body.removeChild(ta);
      showToast('링크가 복사됐어요 ✓');
    });
  toggleFab();
}

/* ===== 카카오 공유 (SDK 방식) =====
   원칙:
   - og:image는 HTML 고정값 (JS로 변경 안 함)
   - 카카오 공유 썸네일은 sendDefault의 imageUrl로만 결정
   - imageUrl 우선순위: 대표사진 → 갤러리 → 기본 썸네일(og-default.jpg)
*/
/* 카카오 공유 이미지: 검증된 http URL만 사용, 아니면 기본 썸네일
   - http/https 아니면 제외
   - null/undefined/빈값 → 기본 썸네일
   - blob/data/상대경로/DOM이미지/signed URL 사용 안 함 */
function getSafeImageUrl(data){
  const DEFAULT='https://kkacmn-cpu.github.io/wedding/og-default.jpg';
  const url=
    data?.main_photo_url ||
    data?.cover_image ||
    DEFAULT;
  if(typeof url!=='string')return DEFAULT;
  if(!url.startsWith('http'))return DEFAULT;
  return url;
}

function shareKakao(){
  console.log('Kakao exists:', !!window.Kakao);
  console.log('Kakao initialized:', window.Kakao?.isInitialized?.());
  console.log('Current URL:', location.href);

  if(!window.Kakao){
    console.error('Kakao SDK not loaded');
    copyCardLink();
    return;
  }
  if(!Kakao.isInitialized()){
    Kakao.init('595f376e62ae3df09dea25e6825e94a4');
  }

  const d=window._cardData;
  const cardUrl=getShareUrl();

  const _gn=d?.groom_name||'신랑', _bn=d?.bride_name||'신부';
  const _orderGb=d?.options?.order_gb!==false;

  /* 대표사진 — 검증된 http URL만, 없으면 기본 썸네일 */
  const imageUrl=getSafeImageUrl(d);
  /* ── 강제 디버깅: 대표사진 URL / 원본 데이터 출력 ──
     아래 KAKAO IMAGE URL 값을 브라우저 새 탭에서 직접 열어보세요.
       - 사진이 보이면 → 정상
       - 404 또는 빈 화면 → 해당 카드의 대표사진 데이터 문제 (코드 문제 아님) */
  console.log('KAKAO IMAGE URL:', imageUrl);

  console.log('main_photo_url:', d?.main_photo_url);
  console.log('👉 위 KAKAO IMAGE URL을 새 탭에서 열어 사진이 보이는지 확인하세요. 안 보이면 대표사진 데이터 문제입니다.');

  try{

      objectType:'feed',
      content:{
        title:title,
        description:desc,
        imageUrl:imageUrl,
        link:{mobileWebUrl:cardUrl,webUrl:cardUrl}
      },
      buttons:[{title:'청첩장 보기',link:{mobileWebUrl:cardUrl,webUrl:cardUrl}}]
    });

  }
}

  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MemoryRetouch//Wedding//KO',
    'BEGIN:VEVENT',
    `DTSTART:${dt}T${tm}`,`DTEND:${dt}T${tm}`,
    `SUMMARY:${title}`,`LOCATION:${loc}`,
    `DESCRIPTION:${getShareUrl()}`,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='wedding.ics';document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(a.href);
  showToast('달력 파일이 다운로드됐어요 📅');
  toggleFab();
}

/* ===== QR 코드 생성 (안정화) ===== */
/* qrcodejs는 내부적으로 canvas 또는 img를 동적 생성함
   → canvas 고정 ID 대신 div 컨테이너를 사용해 안정적으로 처리 */
function showQR(){
  const url=getShareUrl();
  const urlEl=document.getElementById('qrUrl');
  if(urlEl)urlEl.textContent=url;
  const container=document.getElementById('qrContainer');
  if(!container)return;
  /* 이전 QR 초기화 */
  container.innerHTML='';
  if(!window.QRCode){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=()=>_drawQR(url,container);
    s.onerror=()=>showToast('QR 라이브러리 로드 실패');
    document.head.appendChild(s);
  }else{
    _drawQR(url,container);
  }
  const ov=document.getElementById('qrOv');
  if(ov)ov.classList.add('show');
  toggleFab();
}

function _drawQR(url,container){
  try{
    new QRCode(container,{
      text:url,width:200,height:200,
      colorDark:'#3a2f26',colorLight:'#fcf9f4',
      correctLevel:QRCode.CorrectLevel.M
    });
  }catch(e){
    container.textContent='QR 생성 실패';
    console.error('QR 생성 오류:',e);
  }
}

function closeQR(){
  const ov=document.getElementById('qrOv');if(ov)ov.classList.remove('show');
}

/* ===== 수정번호 입력 / 검증 ===== */
function openEditModal(){
  const menu=document.getElementById('fabMenu');if(menu)menu.classList.remove('open');
  const err=document.getElementById('editErr');if(err)err.textContent='';
  const inp=document.getElementById('editCodeInput');if(inp)inp.value='';
  const ov=document.getElementById('editOv');if(ov)ov.classList.add('show');
  if(inp)setTimeout(()=>inp.focus(),100);
}
function closeEditModal(){
  const ov=document.getElementById('editOv');if(ov)ov.classList.remove('show');
}
async function submitEditCode(){
  const inp=document.getElementById('editCodeInput');
  const err=document.getElementById('editErr');
  const btn=document.getElementById('editGoBtn');
  const code=(inp?.value||'').replace(/\D/g,'').trim();
  if(err)err.textContent='';
  if(code.length!==6){if(err)err.textContent='6자리 숫자를 입력해주세요.';return;}
  if(!slug){if(err)err.textContent='청첩장 정보를 찾을 수 없어요.';return;}

  if(btn){btn.disabled=true;btn.textContent='확인 중...';}
  try{
    const{data,error}=await sb.rpc('verify_edit_code',{p_slug:slug,p_edit_code:code});
    if(error){if(err)err.textContent='확인 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.';}
    else if(data&&data.ok){
      /* 검증 성공 → editor 진입 (editCode 전달) */
      location.href='editor.html?slug='+encodeURIComponent(slug)+'&editCode='+encodeURIComponent(code);
      return;
    }else{
      if(err)err.textContent=(data&&data.error)||'수정번호가 일치하지 않습니다.';
    }
  }catch(e){
    if(err)err.textContent='확인 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
  }
  if(btn){btn.disabled=false;btn.textContent='수정하기';}
}

function downloadQR(){
  const container=document.getElementById('qrContainer');
  if(!container){showToast('QR 컨테이너를 찾을 수 없어요');return;}
  /* qrcodejs는 canvas 또는 img를 생성함 */
  const canvas=container.querySelector('canvas');
  const img=container.querySelector('img');
  const a=document.createElement('a');
  a.download='청첩장_QR.png';
  if(canvas){
    try{
      a.href=canvas.toDataURL('image/png');
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      showToast('QR 코드가 저장됐어요 ✓');
    }catch(e){showToast('QR 저장 실패 — 길게 눌러서 저장해주세요');}
  }else if(img&&img.src){
    a.href=img.src;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    showToast('QR 코드가 저장됐어요 ✓');
  }else{
    showToast('QR 코드를 먼저 생성해주세요');
  }
}

main();
</script>
